name: build

# Cross-builds the Usage Guard tweak (and its minimal probe) for iOS 6.1.3 /
# armv7 on a pinned Ubuntu runner, then statically validates both .deb files.
# Nothing is installed on a device from here: the artifacts are the deliverable.
#
# Order matters: the probe package is built and validated first. It is a
# deliberately inert SpringBoard tweak, so if the toolchain or the runtime
# injection strategy is broken, the failure shows up on a package that is
# trivially removable, before the real feature is ever packaged.

on:
  push:
    branches: [main]
    # Tag pushes run the same build+validate, then publish the validated debs
    # as a GitHub Release (see the tag-gated step at the end of the job).
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      theos_ref:
        description: "theos/theos commit to build with (blank = pinned THEOS_REF)"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep Theos outside the checkout: every project stages into <project>/.theos,
  # so installing Theos there would let `make clean` delete the toolchain.
  THEOS: /home/runner/theos
  # Must match `runs-on` below; it is only used for cache keys.
  RUNNER_IMAGE: ubuntu-24.04
  # Pins. Bump deliberately; a rolling Theos/SDK combination is not reproducible.
  THEOS_REF: 8167f59de02fd32cf45b16bfcb1330dfa5c9974c
  IOS_TOOLCHAIN_TAG: main-update_3-eabca92
  SDK_REF: 189a487850e3351cf624b5cef9c8317138c89b05
  SDK_NAME: iPhoneOS6.1.sdk
  SDK_SOURCE_PATH: iPhoneOS6.1.sdk/iPhoneOS6.1.sdk
  THEOS_TARGET: iphone:clang:6.1:6.0
  TWEAK_ARCHS: armv7
  DEB_COMPRESSION: lzma
  # Theos does not link CydiaSubstrate for tweaks; substrate symbols must stay
  # dynamic so MobileSubstrate resolves them at injection time.
  LINK_FLAGS: -Wl,-undefined,dynamic_lookup

jobs:
  build:
    name: armv7 iOS 6.1 cross-build
    # Requested for the tag-gated release step (softprops/action-gh-release).
    # Every other step only reads the checkout; scopes not listed here are none.
    permissions:
      contents: write
    # Pinned: the prebuilt LLVM toolchain links against glibc 2.38, which
    # Ubuntu 22.04 (glibc 2.35) does not provide. Keep this in sync with
    # RUNNER_IMAGE above, which only feeds the cache keys.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # The version lives in control, src/UGVersion.h and the bundle's
      # Info.plist, which different people edit; the pane must read UG_VERSION
      # instead of carrying its own copy. A release with mismatched metadata is
      # worse than a red build.
      - name: Verify version consistency
        run: |
          set -euo pipefail
          want="1.0.2"
          fail=0

          report() {  # $1 file, $2 extracted value, $3 label
            if [ ! -f "$1" ]; then
              echo "::error::$1 is missing; cannot verify $3 (expected $want)"
              fail=1
            elif [ "$2" = "$want" ]; then
              echo "ok   $3 = $2  ($1)"
            else
              echo "::error::$3 in $1 is '$2', expected '$want'"
              fail=1
            fi
          }

          control_version="$(sed -n 's/^Version:[[:space:]]*//p' control | head -n1)"

          # Theos stages prefs/Resources/Info.plist as the bundle's Info.plist;
          # a plain prefs/Info.plist is still accepted. No candidate at all is a
          # hard failure, with a message that says so.
          # Extractions must not trip `set -e` when a file is absent: the file
          # check inside report() produces the diagnostic instead.
          plist_file=""
          for candidate in prefs/Resources/Info.plist prefs/Info.plist; do
            if [ -f "$candidate" ]; then
              plist_file="$candidate"
              break
            fi
          done

          if [ -z "$plist_file" ]; then
            echo "::error::neither prefs/Resources/Info.plist nor prefs/Info.plist exists; cannot verify CFBundleShortVersionString (expected $want)"
            fail=1
          else
            plist_version="$({ grep -A1 'CFBundleShortVersionString' "$plist_file" || :; } \
              | sed -n 's/.*<string>\([^<]*\)<\/string>.*/\1/p' | head -n1)"
            report "$plist_file" "$plist_version" "CFBundleShortVersionString"
          fi

          header_version=""
          if [ -f src/UGVersion.h ]; then
            header_version="$({ grep -E '^[[:space:]]*#define[[:space:]]+UG_VERSION([[:space:]]|$)' \
              src/UGVersion.h || :; } | sed -n 's/.*"\([^"]*\)".*/\1/p' | head -n1)"
          fi

          report control "$control_version" "control Version"
          report src/UGVersion.h "$header_version" "UG_VERSION"

          # The Settings pane must take the version from src/UGVersion.h. A
          # literal in the pane is the one place CI cannot see: it compiles and
          # the next version bump silently ships a pane that reports the old one.
          pane_sources="prefs/UGPreferencesController.m prefs/UGSettingsIPC.m"
          pane_uses_version=0
          for pane_source in $pane_sources; do
            if [ ! -f "$pane_source" ]; then
              echo "::error::$pane_source is missing; cannot verify it uses UG_VERSION"
              fail=1
              continue
            fi
            if grep -nF "\"$want\"" "$pane_source" >&2; then
              echo "::error::$pane_source hard-codes the version string \"$want\"; use @UG_VERSION from src/UGVersion.h"
              fail=1
            else
              echo "ok   $pane_source has no hard-coded \"$want\""
            fi
            if grep -qF "UG_VERSION" "$pane_source"; then
              pane_uses_version=1
            fi
          done
          if [ "$pane_uses_version" -ne 1 ]; then
            echo "::error::neither prefs/UGPreferencesController.m nor prefs/UGSettingsIPC.m references UG_VERSION; the pane must include src/UGVersion.h"
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "::error::version metadata is inconsistent; every file above must read $want"
            exit 1
          fi

      - name: Install host dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential fakeroot rsync curl perl zip unzip git file \
            libxml2 libtinfo6 xz-utils dpkg-dev ca-certificates
          # Theos' fakeroot shim picks the sysv backend; tcp can hang on runners.
          sudo update-alternatives --set fakeroot /usr/bin/fakeroot-sysv
          echo "--- host tool versions ---"
          make --version | awk 'NR==1'
          perl -v | sed -n '2p'
          dpkg-deb --version | awk 'NR==1'
          unzip -v | awk 'NR==1'
          xz --version | awk 'NR==1'
          git --version
          python3 --version

      - name: Cache iOS toolchain tarball
        uses: actions/cache@v4
        with:
          path: ~/.cache/ios6/iOSToolchain-x86_64.tar.xz
          key: ios6-toolchain-${{ env.RUNNER_IMAGE }}-${{ runner.arch }}-${{ env.IOS_TOOLCHAIN_TAG }}

      - name: Cache iPhoneOS6.1 SDK zip
        uses: actions/cache@v4
        with:
          path: ~/.cache/ios6/iPhoneOS6.1.sdk.zip
          key: ios6-sdk-${{ env.RUNNER_IMAGE }}-${{ env.SDK_REF }}

      - name: Setup Theos (pinned)
        env:
          THEOS_REF_OVERRIDE: ${{ github.event.inputs.theos_ref }}
        run: |
          set -euo pipefail
          ref="${THEOS_REF_OVERRIDE:-$THEOS_REF}"
          echo "theos ref: $ref"
          mkdir -p "$THEOS"
          git -C "$THEOS" init -q
          git -C "$THEOS" remote add origin https://github.com/theos/theos.git 2>/dev/null \
            || git -C "$THEOS" remote set-url origin https://github.com/theos/theos.git
          git -C "$THEOS" fetch --depth 1 -q origin "$ref"
          git -C "$THEOS" checkout -q --detach FETCH_HEAD
          if ! git -C "$THEOS" submodule update --init --recursive --depth 1; then
            echo "::warning::shallow submodule fetch failed, retrying with full history"
            git -C "$THEOS" submodule update --init --recursive
          fi
          echo "THEOS commit: $(git -C "$THEOS" rev-parse HEAD)"
          echo "--- submodules ---"
          git -C "$THEOS" submodule status --recursive | sed 's/^/  /'

      - name: Install iOS toolchain (clang + cctools ld + ldid)
        run: |
          set -euo pipefail
          set -x
          tarball="$HOME/.cache/ios6/iOSToolchain-x86_64.tar.xz"
          url="https://github.com/L1ghtmann/llvm-project/releases/download/${IOS_TOOLCHAIN_TAG}/iOSToolchain-x86_64.tar.xz"
          mkdir -p "$(dirname "$tarball")"
          if [ ! -s "$tarball" ]; then
            curl -fL --retry 3 --retry-delay 5 -o "$tarball.part" "$url"
            mv "$tarball.part" "$tarball"
          fi
          echo "toolchain tarball: $(du -h "$tarball" | cut -f1) sha256=$(sha256sum "$tarball" | cut -d' ' -f1)"
          mkdir -p "$THEOS/toolchain"
          tar -xJf "$tarball" -C "$THEOS/toolchain"
          test -x "$THEOS/toolchain/linux/iphone/bin/clang" || {
            echo "::error::toolchain extraction produced no clang at \$THEOS/toolchain/linux/iphone/bin/clang"
            find "$THEOS/toolchain" -maxdepth 4 | awk 'NR<=40'
            exit 1
          }

      - name: Install iPhoneOS6.1 SDK
        run: |
          set -euo pipefail
          set -x
          zip="$HOME/.cache/ios6/iPhoneOS6.1.sdk.zip"
          base="https://raw.githubusercontent.com/qianjigui/iOS-sdks/${SDK_REF}/${SDK_SOURCE_PATH}.zip"
          mkdir -p "$(dirname "$zip")"
          if [ ! -s "$zip" ]; then
            # The SDK is published as three split zip volumes and must be
            # concatenated in order before unzip can read it.
            for part in 001 002 003; do
              curl -fL --retry 3 --retry-delay 5 -o "$zip.part.$part" "${base}.${part}"
            done
            cat "$zip.part.001" "$zip.part.002" "$zip.part.003" > "$zip.part"
            unzip -tq "$zip.part" >/dev/null
            mv "$zip.part" "$zip"
            rm -f "$zip".part.*
          fi
          echo "sdk zip: $(du -h "$zip" | cut -f1) sha256=$(sha256sum "$zip" | cut -d' ' -f1)"
          mkdir -p "$THEOS/sdks"
          rm -rf "$THEOS/sdks/$SDK_NAME"
          unzip -q "$zip" -d "$THEOS/sdks"
          rm -rf "$THEOS/sdks/__MACOSX"
          test -d "$THEOS/sdks/$SDK_NAME" || {
            echo "::error::$SDK_NAME missing after unzip; contents:"
            ls -la "$THEOS/sdks"
            exit 1
          }

      - name: Verify SDK contents
        run: |
          set -euo pipefail
          sdk="$THEOS/sdks/$SDK_NAME"
          echo "--- $THEOS/sdks ---"
          ls -la "$THEOS/sdks"
          echo "--- $SDK_NAME/System/Library/Frameworks (head) ---"
          ls "$sdk/System/Library/Frameworks" | awk 'NR<=20'
          echo "--- $SDK_NAME/usr/include (head) ---"
          ls "$sdk/usr/include" | awk 'NR<=20'
          missing=0
          for path in \
            System/Library/Frameworks/UIKit.framework/Headers/UIKit.h \
            System/Library/Frameworks/UIKit.framework/UIKit \
            System/Library/Frameworks/Foundation.framework/Headers/Foundation.h \
            System/Library/Frameworks/Foundation.framework/Foundation \
            System/Library/Frameworks/Security.framework/Headers/Security.h \
            System/Library/Frameworks/Security.framework/Security \
            usr/include/objc/runtime.h \
            usr/lib/libSystem.B.dylib \
            usr/lib/libobjc.A.dylib \
            SDKSettings.plist; do
            if [ -e "$sdk/$path" ]; then
              echo "  ok   $path"
            else
              echo "  MISS $path"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::$SDK_NAME is incomplete (headers and link stubs are required)"
            exit 1
          fi
          if grep -q 'iphoneos6.1' "$sdk/SDKSettings.plist"; then
            echo "SDKSettings: iphoneos6.1"
          else
            echo "::error::SDKSettings.plist does not identify iphoneos6.1"
            exit 1
          fi
          du -sh "$sdk"

      - name: Verify toolchain
        run: |
          set -euo pipefail
          tc="$THEOS/toolchain/linux/iphone/bin"
          echo "--- theos ---"
          echo "THEOS=$THEOS"
          echo "commit=$(git -C "$THEOS" rev-parse HEAD)"
          echo "--- toolchain binaries ---"
          for tool in clang clang++ ld ldid lipo strip codesign_allocate; do
            if [ -x "$tc/$tool" ]; then
              echo "  ok   $tool"
            else
              echo "  MISS $tool"
              missing=1
            fi
          done
          if [ "${missing:-0}" -ne 0 ]; then
            echo "::error::the iOS toolchain at $tc is incomplete"
            ls -la "$tc" | awk 'NR<=40'
            exit 1
          fi
          echo "--- clang ---"
          "$tc/clang" --version | awk 'NR<=3'
          echo "clang -dumpversion: $("$tc/clang" -dumpversion)"
          echo "--- cctools ld (ld64), required: the 6.1 SDK ships binary .dylib stubs, no .tbd ---"
          file "$tc/ld"
          "$tc/ld" -version_details 2>&1 | awk 'NR<=3' || true
          echo "--- ldid ---"
          file "$tc/ldid"
          "$tc/ldid" -h 2>&1 | awk 'NR==1' || true
          echo "--- lipo / strip ---"
          file "$tc/lipo" "$tc/strip"
          "$tc/lipo" -version 2>&1 | awk 'NR==1' || true
          echo "--- ldid -S + lipo smoke test on an armv7 slice of an SDK stub ---"
          tmp="$(mktemp -d)"
          "$tc/lipo" "$THEOS/sdks/$SDK_NAME/usr/lib/libobjc.A.dylib" -thin armv7 -output "$tmp/probe.dylib"
          before=$(stat -c%s "$tmp/probe.dylib")
          "$tc/ldid" -S "$tmp/probe.dylib"
          after=$(stat -c%s "$tmp/probe.dylib")
          echo "ldid -S ok: $before -> $after bytes"
          python3 - "$tmp/probe.dylib" <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          import validate_deb
          info, errors = validate_deb.parse_macho(open(sys.argv[1], "rb").read())
          bad = [e for e in errors if "LC_CODE_SIGNATURE" in e]
          if bad:
              sys.exit("ldid -S did not add LC_CODE_SIGNATURE: %s" % bad)
          print("thin armv7 slice signed ok: cputype=%s subtype=%s install_name=%s"
                % (info.get("cputype"), info.get("cpusubtype"), info.get("install_name")))
          PY
          rm -rf "$tmp"
          echo "--- build variables ---"
          echo "TARGET=$THEOS_TARGET ARCHS=$TWEAK_ARCHS FINALPACKAGE=1 DEB_COMPRESSION=$DEB_COMPRESSION"
          echo "ADDITIONAL_LDFLAGS=$LINK_FLAGS"
          echo "uname: $(uname -a)"
          echo "nproc: $(nproc)"

      - name: Self-test the .deb validator
        run: |
          set -euo pipefail
          python3 scripts/selftest_validate_deb.py

      - name: Build + validate probe package
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/build-logs"
          log="$GITHUB_WORKSPACE/build-logs/probe-build.log"
          # Rootful package: no THEOS_PACKAGE_SCHEME, no /var/jb prefix.
          unset THEOS_PACKAGE_SCHEME || true
          cmd=(make -C probe clean package
               "THEOS=$THEOS"
               "TARGET=$THEOS_TARGET"
               "ARCHS=$TWEAK_ARCHS"
               "ADDITIONAL_LDFLAGS=$LINK_FLAGS"
               "THEOS_PLATFORM_DEB_COMPRESSION_TYPE=$DEB_COMPRESSION"
               FINALPACKAGE=1)
          echo "command: ${cmd[*]}"
          set +e
          "${cmd[@]}" 2>&1 | tee "$log"
          status="${PIPESTATUS[0]}"
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::probe build failed (exit $status); full make output is above and in build-logs/probe-build.log"
            exit "$status"
          fi
          set -- probe/packages/*.deb
          if [ ! -e "$1" ]; then
            echo "::error::probe build produced no package in probe/packages"
            exit 1
          fi
          deb="$(ls -1t probe/packages/*.deb | awk 'NR==1')"
          echo "built: $deb ($(stat -c%s "$deb") bytes)"
          sha256sum "$deb" | tee -a "$log"
          python3 scripts/validate_deb.py "$deb" \
            --expect-package org.usageguard.probe \
            --expect-base UsageGuardProbe \
            | tee -a "$log" | tee "$GITHUB_WORKSPACE/build-logs/probe-validation.txt"

      # The probe is already built and validated at this point: publishing it
      # now keeps the validated smoke-test deb in the run even if the full
      # tweak compile below fails.
      - name: Upload probe .deb
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: usage-guard-probe-deb
          path: probe/packages/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: Build + validate Usage Guard package
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/build-logs"
          log="$GITHUB_WORKSPACE/build-logs/usage-guard-build.log"
          unset THEOS_PACKAGE_SCHEME || true
          cmd=(make clean package
               "THEOS=$THEOS"
               "TARGET=$THEOS_TARGET"
               "ARCHS=$TWEAK_ARCHS"
               "ADDITIONAL_LDFLAGS=$LINK_FLAGS"
               "THEOS_PLATFORM_DEB_COMPRESSION_TYPE=$DEB_COMPRESSION"
               FINALPACKAGE=1)
          echo "command: ${cmd[*]}"
          set +e
          "${cmd[@]}" 2>&1 | tee "$log"
          status="${PIPESTATUS[0]}"
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::Usage Guard build failed (exit $status); full make output is above and in build-logs/usage-guard-build.log"
            exit "$status"
          fi
          # Diagnostics only. Theos stages subproject installs separately, so
          # .theos/_ can be partial here even when the packaged deb is complete;
          # the authoritative payload check is scripts/validate_deb.py on the
          # built deb below.
          echo "--- staged payload (.theos/_) ---"
          if [ ! -d .theos/_ ]; then
            echo "::warning::no staged payload at .theos/_; cannot list what make package staged (the built deb is still validated)"
          else
            staged="$(find .theos/_ -type f | sort)"
            printf '%s\n' "$staged"
            for required in \
              Library/MobileSubstrate/DynamicLibraries/UsageGuard.dylib \
              Library/PreferenceLoader/Preferences/UsageGuard.plist; do
              if ! printf '%s\n' "$staged" | grep -qxF ".theos/_/$required"; then
                echo "::warning::staged payload does not list $required (the built deb is validated by scripts/validate_deb.py)"
              fi
            done
          fi
          set -- packages/*.deb
          if [ ! -e "$1" ]; then
            echo "::error::Usage Guard build produced no package in packages/"
            exit 1
          fi
          deb="$(ls -1t packages/*.deb | awk 'NR==1')"
          echo "built: $deb ($(stat -c%s "$deb") bytes)"
          sha256sum "$deb" | tee -a "$log"
          python3 scripts/validate_deb.py "$deb" --forbid-package org.usageguard.probe \
            | tee -a "$log" | tee "$GITHUB_WORKSPACE/build-logs/usage-guard-validation.txt"

      # Real package first: it is the deliverable. Failures never upload a
      # half-built artifact; only logs are uploaded unconditionally.
      - name: Upload Usage Guard .deb
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: usage-guard-deb
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 30

      # Tag pushes (v*) additionally publish the already-validated packages as a
      # GitHub Release. Branch/workflow_dispatch runs stop after the artifact
      # uploads above; no validation gate is relaxed and nothing is rebuilt.
      - name: Compose release notes (tag builds only)
        if: success() && startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, hashlib, os

          root = os.environ.get("GITHUB_WORKSPACE", ".")
          tag = os.environ["GITHUB_REF_NAME"]
          run_url = "%s/%s/actions/runs/%s" % (
              os.environ.get("GITHUB_SERVER_URL", "https://github.com"),
              os.environ["GITHUB_REPOSITORY"],
              os.environ["GITHUB_RUN_ID"],
          )


          def newest(pattern):
              matches = [p for p in glob.glob(os.path.join(root, pattern)) if os.path.isfile(p)]
              if not matches:
                  raise SystemExit("no file matched %r; nothing to publish" % pattern)
              return max(matches, key=os.path.getmtime)


          def digest(path):
              sha = hashlib.sha256()
              with open(path, "rb") as handle:
                  for chunk in iter(lambda: handle.read(1 << 20), b""):
                      sha.update(chunk)
              return sha.hexdigest()


          def summary(rel):
              path = os.path.join(root, rel)
              if not os.path.isfile(path):
                  raise SystemExit("missing validation summary %s" % rel)
              return open(path).read().strip()


          main_deb = newest("packages/org.usageguard.timer_*_iphoneos-arm.deb")
          probe_deb = newest("probe/packages/org.usageguard.probe_*_iphoneos-arm.deb")
          main_name = os.path.basename(main_deb)
          probe_name = os.path.basename(probe_deb)

          lines = [
              "## Usage Guard %s" % tag,
              "",
              "**armv7 (32-bit) · iOS 6.0+ · rootful** — for jailbroken iOS 6 devices",
              "(iPhone 4S, iPad 2/3, iPod touch 5) with Cydia Substrate and PreferenceLoader",
              "installed.",
              "",
              "- package id: `org.usageguard.timer`",
              "- architecture: armv7 only; deployment target iOS 6.0; rootful layout",
              "- built and statically validated by CI: %s" % run_url,
              "",
              "### Install",
              "",
              "```sh",
              "scp %s root@<device-ip>:/var/root/" % main_name,
              "ssh root@<device-ip> \"dpkg -i /var/root/%s && killall -9 SpringBoard\"" % main_name,
              "```",
              "",
              "Copying the .deb to the device with iFile/Filza and installing it also works.",
              "",
              "### Uninstall",
              "",
              "```sh",
              "dpkg -r org.usageguard.timer",
              "```",
              "",
              "### Assets",
              "",
              "| file | sha256 | contents |",
              "| --- | --- | --- |",
              "| `%s` | `%s` | Usage Guard tweak |" % (main_name, digest(main_deb)),
              "| `%s` | `%s` | optional smoke-test probe |" % (probe_name, digest(probe_deb)),
              "",
              "SHA-256 of the published files:",
              "",
              "```",
              "%s  %s" % (digest(main_deb), main_name),
              "%s  %s" % (digest(probe_deb), probe_name),
              "```",
              "",
              "`%s` only proves that injection works: it hooks SpringBoard's" % probe_name,
              "`applicationDidFinishLaunching:`, shows a 3 second non-interactive label and logs",
              "once. It writes nothing and stores nothing.",
              "",
              "```sh",
              "dpkg -i %s" % probe_name,
              "dpkg -r org.usageguard.probe",
              "touch /var/mobile/Library/Preferences/org.usageguard.probe.disable  # disable without uninstalling",
              "```",
              "",
              "### Validation",
              "",
              "Both packages were checked by `scripts/validate_deb.py`: thin armv7 Mach-O",
              "(cputype 12 / subtype 9), `LC_VERSION_MIN_IPHONEOS` 6.0.0, `LC_CODE_SIGNATURE`,",
              "`Architecture: iphoneos-arm` and `Depends: mobilesubstrate`. The Settings entry",
              "must be a controller (`isController` true with a `detail` class) and the bundle",
              "`Info.plist` must declare `CFBundleExecutable` and `NSPrincipalClass`.",
              "",
              "`%s` carries exactly this payload; a missing or extra file fails the build:" % main_name,
              "",
              "```",
              "Library/MobileSubstrate/DynamicLibraries/UsageGuard.dylib",
              "Library/MobileSubstrate/DynamicLibraries/UsageGuard.plist",
              "Library/PreferenceBundles/UsageGuardPrefs.bundle/UsageGuardPrefs",
              "Library/PreferenceBundles/UsageGuardPrefs.bundle/Info.plist",
              "Library/PreferenceLoader/Preferences/UsageGuard.plist",
              "```",
              "",
              "The dylib is an armv7 `MH_DYLIB`, the preference bundle binary an armv7",
              "`MH_BUNDLE`; both are signed. Because of the bundle the package depends on",
              "`preferenceloader`. `%s` stays a dependency-free two-file package" % probe_name,
              "(dylib plus filter plist).",
              "",
              "<details><summary>Usage Guard — %s</summary>" % main_name,
              "",
              "```",
              summary("build-logs/usage-guard-validation.txt"),
              "```",
              "",
              "</details>",
              "",
              "<details><summary>Probe — %s</summary>" % probe_name,
              "",
              "```",
              summary("build-logs/probe-validation.txt"),
              "```",
              "",
              "</details>",
              "",
          ]

          out = os.path.join(root, "build-logs", "release-notes.md")
          with open(out, "w") as handle:
              handle.write("\n".join(lines))
          print("wrote %s (%d bytes)" % (out, os.path.getsize(out)))
          PY
          echo "--- release-notes.md ---"
          cat build-logs/release-notes.md

      - name: Publish GitHub release (tag builds only)
        if: success() && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Usage Guard ${{ github.ref_name }}
          body_path: build-logs/release-notes.md
          draft: false
          prerelease: false
          preserve_order: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            packages/org.usageguard.timer_*_iphoneos-arm.deb
            probe/packages/org.usageguard.probe_*_iphoneos-arm.deb

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build-logs/
          if-no-files-found: ignore
          retention-days: 14
